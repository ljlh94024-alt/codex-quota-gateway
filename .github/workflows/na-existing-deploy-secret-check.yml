name: na-existing-deploy-secret-check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      S1: ${{ secrets.TIANGONG_NA_SSH_KEY }}
      S2: ${{ secrets.NA_SSH_PRIVATE_KEY }}
      S3: ${{ secrets.NORTH_AMERICA_SSH_KEY }}
      S4: ${{ secrets.SSH_PRIVATE_KEY }}
      S5: ${{ secrets.TIANGONG_SSH_PRIVATE_KEY }}
      S6: ${{ secrets.NA_CORE_SSH_KEY }}
      S7: ${{ secrets.SERVER_SSH_KEY }}
      S8: ${{ secrets.DEPLOY_SSH_KEY }}
      S9: ${{ secrets.VPS_SSH_KEY }}
      S10: ${{ secrets.PROD_SSH_KEY }}
      S11: ${{ secrets.SSH_HOST }}
      S12: ${{ secrets.SERVER_HOST }}
      S13: ${{ secrets.DEPLOY_HOST }}
      S14: ${{ secrets.SSH_USER }}
    steps:
      - name: Report only capability presence
        shell: bash
        run: |
          set -u
          for n in S1 S2 S3 S4 S5 S6 S7 S8 S9 S10 S11 S12 S13 S14; do
            if [ -n "${!n:-}" ]; then printf '%s=present\n' "$n"; else printf '%s=absent\n' "$n"; fi
          done
          for port in 22 2178; do
            if timeout 8 bash -c "</dev/tcp/142.4.38.78/$port" 2>/dev/null; then printf 'port_%s=open\n' "$port"; else printf 'port_%s=closed_or_refused\n' "$port"; fi
          done
